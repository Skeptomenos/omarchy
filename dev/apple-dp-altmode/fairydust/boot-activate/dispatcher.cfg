unset dev147_root
unset dev147_esp
for dev147_module in part_gpt ext2 fat search search_fs_uuid test hashsum gcry_sha256 configfile; do
  insmod $dev147_module
done
if [ 0 = 1 ]; then
  echo DEV147_TEST_UNAVAILABLE
else
  if search --no-floppy --fs-uuid --set=dev147_root e24cf117-3c89-4392-a3b8-def187becda8; then
    if search --no-floppy --fs-uuid --set=dev147_esp 0A48-269E; then
      if [ -n "$dev147_root" ]; then
        if [ -n "$dev147_esp" ]; then
          if [ -s ($dev147_root)/boot/grub/dev147-paired-7.1.12-dev147-fairydust1/old.sha256 ]; then
            if [ -s ($dev147_root)/boot/grub/dev147-paired-7.1.12-dev147-fairydust1/candidate.sha256 ]; then
              if hashsum --hash sha256 --check ($dev147_root)/boot/grub/dev147-paired-7.1.12-dev147-fairydust1/old.sha256 --prefix ($dev147_esp); then
                if hashsum --hash sha256 --check ($dev147_root)/boot/grub/dev147-paired-7.1.12-dev147-fairydust1/candidate.sha256 --prefix ($dev147_esp); then
                  echo DEV147_HASH_AMBIGUOUS
                else
                  configfile ($dev147_root)/boot/grub/dev147-paired-7.1.12-dev147-fairydust1/old.cfg
                fi
              else
                if hashsum --hash sha256 --check ($dev147_root)/boot/grub/dev147-paired-7.1.12-dev147-fairydust1/candidate.sha256 --prefix ($dev147_esp); then
                  configfile ($dev147_root)/boot/grub/dev147-paired-7.1.12-dev147-fairydust1/candidate.cfg
                fi
              fi
            fi
          fi
        fi
      fi
    fi
  fi
fi
echo DEV147_SELECTION_STOP
